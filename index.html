<!DOCTYPE html>
<html lang="fr" class="t-grand">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Luna — Astronomie</title>
<meta name="description" content="Lune, Soleil, planètes, carte du ciel, événements et missions spatiales">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luna">
<meta name="theme-color" content="#060816">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#060816; --bg1:#0a0f26; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075); --line:rgba(255,255,255,.09);
  --text:#f1ecdd; --text2:#cfcabb; --text3:#a4a2b4; --gold:#e6ca82; --gold-d:rgba(230,202,130,.16);
  --blue:#9dc2ff; --good:#66d89c; --ok:#bcd96b; --warn:#f2b056; --bad:#f06e64;
  --r:18px; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:66px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html{font-size:18px;overscroll-behavior-y:contain;-webkit-text-size-adjust:100%}
html.t-normal{font-size:16px} html.t-grand{font-size:18px} html.t-xl{font-size:20.5px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg0);color:var(--text);font-family:var(--sans);line-height:1.45;
  overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.25em}
#bgsky{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#060816 0%,#0a0f26 55%,#11163a 100%)}
#bgsky canvas{width:100%;height:100%;display:block}
#redfilter{position:fixed;inset:0;z-index:9999;pointer-events:none;background:#d80000;mix-blend-mode:multiply;display:none}
html.red #redfilter{display:block}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 14px calc(var(--nav-h) + var(--safe-b) + 18px)}

/* ── En-tête ── */
header{position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(var(--safe-t) + 8px) 14px 8px;
  background:linear-gradient(180deg,rgba(6,8,22,.97),rgba(6,8,22,.86));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.05)}
.hrow{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--serif);font-size:1.55rem;letter-spacing:.32em;font-weight:500;color:var(--text);padding-left:2px}
.loc{margin-left:auto;display:flex;align-items:center;gap:5px;max-width:52%;padding:7px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);
  color:var(--text2);font-size:.82rem;white-space:nowrap;overflow:hidden}
.loc span{overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.iconbtn:active{background:var(--card2)}
.drow{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px}
.datebtn{min-width:12em;padding:7px 14px;border-radius:20px;font-size:.95rem;color:var(--text);text-align:center}
.datebtn small{display:block;font-size:.72rem;color:var(--gold);letter-spacing:.04em}
.datebtn:active{background:var(--card2)}

/* ── Navigation basse ── */
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 6px calc(6px + var(--safe-b));
  background:rgba(6,8,22,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.07)}
nav#nav .in{max-width:480px;margin:0 auto;display:flex}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:14px;color:var(--text3);font-size:.7rem;min-height:52px;justify-content:center}
.nb svg.i{width:1.55rem;height:1.55rem}
.nb.on{color:var(--gold)}
.nb.on .pill{background:var(--gold-d)}
.nb .pill{padding:3px 14px;border-radius:14px;display:grid;place-items:center;transition:background .2s}

/* ── Contenu ── */
#view{padding-top:12px}
.anim-in{animation:fadeIn .28s ease-out}
.anim-left{animation:slideL .26s ease-out}
.anim-right{animation:slideR .26s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.anim-in,.anim-left,.anim-right{animation:none}}
h2.t{font-family:var(--serif);font-weight:500;font-size:1.55rem;margin:4px 2px 10px;letter-spacing:.01em}
h3.st{font-size:.76rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:22px 4px 8px;display:flex;align-items:center;gap:8px}
h3.st .r{margin-left:auto;letter-spacing:0;text-transform:none;font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card+.card{margin-top:10px}
.pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid rgba(255,255,255,.06)}
.row:first-child{border-top:0}
.row .l{color:var(--text2);flex:1;min-width:0}
.row .v{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--text3)} .dim{color:var(--text2)} .gold{color:var(--gold)} .small{font-size:.82rem} .xs{font-size:.72rem}
.serif{font-family:var(--serif)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.stat .n{font-size:1.35rem;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .s{font-size:.78rem;color:var(--text2);margin-top:1px}
.tap{transition:transform .12s,background .2s}
.tap:active{transform:scale(.985);background:var(--card2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:22px;
  border:1px solid rgba(230,202,130,.45);background:rgba(230,202,130,.1);color:var(--text);font-size:.9rem}
.btn:active{background:rgba(230,202,130,.22)}
.btn.solid{background:var(--gold);color:#17142b;border-color:var(--gold);font-weight:600}
.btn.solid:active{background:#f3dca0}
.btn.block{width:100%}
.btn.on{background:rgba(102,216,156,.22);border-color:rgba(102,216,156,.7)}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;min-height:42px;border-radius:12px;color:var(--text2);font-size:.9rem}
.seg button.on{background:var(--gold-d);color:var(--gold);font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--text2);font-size:.82rem;min-height:38px}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-d)}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.72rem;font-weight:500;white-space:nowrap}
.b-good{background:rgba(102,216,156,.15);color:var(--good)} .b-gold{background:var(--gold-d);color:var(--gold)}
.b-blue{background:rgba(157,194,255,.14);color:var(--blue)} .b-grey{background:rgba(255,255,255,.08);color:var(--text3)} .b-bad{background:rgba(240,110,100,.14);color:var(--bad)}
.note{font-size:.76rem;color:var(--text3);text-align:center;margin:14px 8px 0;line-height:1.5}
.empty{padding:22px 16px;text-align:center;color:var(--text3);font-size:.9rem}
.loading{padding:22px 16px;text-align:center;color:var(--text3);font-size:.9rem;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pdisc{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset -6px -5px 10px rgba(0,0,0,.45),0 0 12px rgba(255,255,255,.08)}

/* ── Héros « Ce soir » ── */
.hero{display:flex;gap:16px;align-items:center;padding:16px;background:radial-gradient(120% 140% at 0% 0%,rgba(120,140,220,.18),rgba(255,255,255,.03) 60%);
  border:1px solid rgba(157,194,255,.16);border-radius:22px}
.hero .txt{flex:1;min-width:0}
.hero .ttl{font-family:var(--serif);font-size:1.45rem;line-height:1.15}
.stars{display:flex;gap:2px;margin:6px 0 2px}
.stars svg{width:1.25rem;height:1.25rem}
canvas.moon{display:block;border-radius:50%}
.moonglow{border-radius:50%;flex:none}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;margin-bottom:10px;background:rgba(157,194,255,.1);border:1px solid rgba(157,194,255,.25)}
.banner.good{background:rgba(102,216,156,.12);border-color:rgba(102,216,156,.35)}

/* ── Cartes horizontales « À voir » ── */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.see{flex:0 0 68%;max-width:250px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;text-align:left}
.see .top{display:flex;align-items:center;gap:10px}
.see .nm{font-weight:500;font-size:1rem}
.see .d{font-size:.82rem;color:var(--text2);margin-top:8px;line-height:1.4}
.see .w{font-size:.78rem;color:var(--gold);margin-top:6px}

/* ── Tableau météo horaire ── */
.wxwrap{overflow-x:auto;scrollbar-width:none;margin:0}
.wxwrap::-webkit-scrollbar{display:none}
table.wx{border-collapse:separate;border-spacing:0;font-size:.74rem;font-variant-numeric:tabular-nums}
table.wx th,table.wx td{padding:0;text-align:center;min-width:34px;height:28px}
table.wx th.lab{position:sticky;left:0;z-index:2;background:#0d1230;text-align:left;padding:0 8px 0 12px;min-width:84px;color:var(--text2);font-weight:400;white-space:nowrap}
table.wx td .c{margin:1px;height:24px;border-radius:5px;display:grid;place-items:center;color:#10132a;font-weight:600;font-size:.68rem}
table.wx tr.hr td{color:var(--text2);font-size:.7rem}
table.wx tr.sep th,table.wx tr.sep td{border-top:1px solid rgba(255,255,255,.06)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:10px 14px 12px;font-size:.72rem;color:var(--text3)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* ── Listes ── */
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-top:1px solid rgba(255,255,255,.06);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06)}
.item .bd{flex:1;min-width:0}
.item .tt{font-weight:500;line-height:1.3}
.item .dd{font-size:.82rem;color:var(--text2);margin-top:3px;line-height:1.4}
.item .rt{text-align:right;flex:none;font-size:.8rem}
.item .rt .dt{color:var(--gold)} .item .rt .wn{color:var(--text3);font-size:.74rem;margin-top:2px}
.c-eclipse{color:#ff8f6b} .c-meteor{color:#b9a7ff} .c-planet{color:#f0d3a8} .c-moon{color:#e8e2c8} .c-season{color:#8fd8b0} .c-launch{color:#9dc2ff}

/* ── Calendrier ── */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.calhead .m{font-family:var(--serif);font-size:1.35rem;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dw{text-align:center;font-size:.7rem;color:var(--text3);padding:4px 0}
.cal .cd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:12px;border:1px solid transparent;min-height:58px}
.cal .cd img{width:24px;height:24px}
.cal .cd .n{font-size:.78rem;color:var(--text2);font-variant-numeric:tabular-nums}
.cal .cd.today .n{color:var(--gold);font-weight:600}
.cal .cd.sel{border-color:var(--gold);background:var(--gold-d)}
.cal .cd .dots{display:flex;gap:2px;height:5px}
.cal .cd .dots i{width:5px;height:5px;border-radius:50%;display:block}

/* ── Accordéons ── */
.acc>button{display:flex;align-items:center;gap:10px;width:100%;padding:15px 16px;text-align:left}
.acc>button .tt{flex:1;font-weight:500}
.acc>button .chev{transition:transform .2s;color:var(--gold)}
.acc.open>button .chev{transform:rotate(90deg)}
.acc .body{display:none;border-top:1px solid rgba(255,255,255,.06)}
.acc.open .body{display:block}

/* ── Carte du ciel ── */
.skybox{position:relative;border-radius:50%;margin:0 auto}
#skyc{display:block;touch-action:none;border-radius:22px;margin:0 auto;border:1px solid var(--line)}
.skytools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.skytools .btn{padding:8px 11px;font-size:.84rem;min-height:42px}
.timebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin-top:10px}
.timebar input{min-width:90px}
@media (max-width:400px){.timebar .tl{order:-1;width:100%;display:flex;justify-content:center;gap:8px;align-items:baseline}}
.timebar .btn{white-space:nowrap;min-height:40px;padding:6px 10px;font-size:.84rem}
.timebar input{flex:1;accent-color:var(--gold);height:32px}
.timebar .tl{min-width:4.6em;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:500;line-height:1.2}
#skyinfo{margin-top:10px}
#skyfs{position:fixed;inset:0;z-index:200;background:#03040c;touch-action:none}
#skyfs canvas{position:absolute;inset:0;touch-action:none}
#skyfs .bar{position:absolute;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px 12px;z-index:2}
#skyfs .bar.top{top:0;padding-top:calc(10px + var(--safe-t));background:linear-gradient(180deg,rgba(3,4,12,.92),rgba(3,4,12,0))}
#skyfs .bar.bot{bottom:0;flex-direction:column;align-items:stretch;padding-bottom:calc(10px + var(--safe-b));background:linear-gradient(0deg,rgba(3,4,12,.95),rgba(3,4,12,0))}
#skyfs .btn{background:#ecd79c;color:#161329;border-color:#fff;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.6)}
#skyfs .btn.on{background:#8fe6b5}
#skyfs .fsinfo{font-size:.9rem;max-height:38vh;overflow:auto}
#skyfs .fsinfo .card{background:rgba(12,15,38,.96);border-color:rgba(255,255,255,.15)}
#skyfs .timebar{background:rgba(12,15,38,.9);border-radius:16px}

/* ── Panneaux ── */
.sheet-bg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:#0d1230;border:1px solid rgba(255,255,255,.1);border-bottom:0;
  border-radius:24px 24px 0 0;padding:8px 16px calc(20px + var(--safe-b));overscroll-behavior:contain}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:4px auto 8px}
.sheet .sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet .sh h2{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin:0;flex:1}
.field{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-size:1rem}
.field:focus{outline:2px solid rgba(230,202,130,.5)}
.switch{position:relative;width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.14);flex:none;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--good)} .switch.on::after{transform:translateX(22px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:400;max-width:92%;
  background:#ecd79c;color:#17142b;padding:11px 18px;border-radius:22px;font-size:.9rem;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:fadeIn .2s}
.searchres{max-height:55vh;overflow:auto;margin-top:8px}
.arc{display:block;width:100%;height:auto}
.bar7{display:flex;align-items:flex-end;gap:6px;height:120px;padding:10px 14px 0}
.bar7 .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar7 .b i{display:block;width:100%;border-radius:6px 6px 3px 3px}
.bar7 .b span{font-size:.72rem;color:var(--text2);font-variant-numeric:tabular-nums}
.bar7lab{display:flex;gap:6px;padding:4px 14px 12px}
.bar7lab span{flex:1;text-align:center;font-size:.68rem;color:var(--text3);text-transform:capitalize}
.flag{font-size:1.25em;line-height:1;vertical-align:-2px;font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.dd.fr{color:var(--text);margin-top:4px}
details.xs{margin-top:4px}details.xs summary{cursor:pointer;color:var(--gold)}
.item.launch{display:block}
.lhead{display:flex;gap:12px;align-items:center}
.lhead .tt{flex:1;min-width:0}
.lhead .badge{flex:none}
.lwhen{color:var(--gold);margin:8px 0 2px;font-size:.95rem}

button.brand{background:none;border:0;cursor:pointer;color:var(--text)}
html.homeopen body{overflow:hidden}
#home{display:none;position:fixed;inset:0;z-index:150;overflow-y:auto;-webkit-overflow-scrolling:touch;color:#eaf8ff;
  --cy:#5ee7ff;--cy2:rgba(94,231,255,.55);--am:#ffb547;--txt2:#bcd8e4;font-family:Inter,'Exo 2',var(--sans);
  background:radial-gradient(ellipse 100% 45% at 50% 30%,rgba(25,80,120,.35),transparent 70%),#02040b}
#home.on{display:block;animation:hmIn .45s ease-out}
#home.out{animation:hmOut .3s ease-in forwards;pointer-events:none}
@keyframes hmIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes hmOut{to{opacity:0;transform:scale(.96)}}
.hm-wrap{max-width:480px;margin:0 auto;padding:calc(var(--safe-t) + 12px) 12px calc(var(--safe-b) + 20px);display:flex;flex-direction:column;gap:10px}
/* panneaux biseautés lumineux */
.hx{--cut:14px;display:block;position:relative;filter:drop-shadow(0 0 5px rgba(94,231,255,.45));border:0;padding:0;background:none;color:inherit;font:inherit;text-align:left;width:100%}
.hx>.b{display:block;padding:1.5px;background:var(--cy);clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));height:100%;box-sizing:border-box}
.hx>.b>.in{display:block;height:100%;box-sizing:border-box;background:linear-gradient(170deg,#0b1a2e,#050b18 70%);clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut))}
.hx.hm-head>.b>.in{display:flex;align-items:center;gap:12px;padding:14px 16px}
.hm-logoic svg{width:54px;height:54px;color:var(--cy);stroke-width:1.6;filter:drop-shadow(0 0 6px var(--cy))}
.hm-brand{flex:1;display:flex;flex-direction:column}
.hm-logo{font-family:Orbitron,var(--sans);font-weight:700;font-size:2.6rem;line-height:1;letter-spacing:.06em;color:#bff6ff;text-shadow:0 0 10px var(--cy),0 0 22px rgba(94,231,255,.6)}
.hm-subtitle{font-size:1.05rem;font-weight:600;color:var(--cy);margin-top:4px}
.hm-gear{width:56px;height:56px;display:grid;place-items:center;border:0;cursor:pointer;color:var(--cy);background:var(--cy);
  clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);position:relative}
.hm-gear::before{content:"";position:absolute;inset:2px;background:#071324;clip-path:inherit}
.hm-gear svg{position:relative;width:28px;height:28px}
.hx.hm-status>.b>.in{display:flex;align-items:center;gap:12px;padding:10px 16px}
.hm-status .on{display:flex;align-items:center;gap:10px;color:#6bff8f;font-weight:600;font-size:1rem}
.hm-status .dot{width:14px;height:14px;border-radius:50%;background:#33ff77;box-shadow:0 0 10px #33ff77;animation:hmBlink 2.4s infinite}
@keyframes hmBlink{50%{opacity:.35}}
.hm-status .sep{width:1px;align-self:stretch;background:var(--cy2)}
.hm-status .hm-loc{display:flex;gap:8px;align-items:flex-start;flex:1;min-width:0}
.hm-status .hm-loc svg{width:22px;height:22px;color:#fff;flex:none;margin-top:2px}
.hm-status .hm-loc b{display:block;font-weight:600;font-size:1.05rem}
.hm-status .hm-loc small{display:block;color:var(--cy);font-size:.85rem}
.hx.hm-clock>.b>.in{display:flex;flex-direction:column;align-items:center;padding:12px 10px 14px}
.hm-clock #hmtime{font-family:Orbitron,var(--sans);font-weight:700;font-size:3rem;line-height:1.1;color:#bff6ff;text-shadow:0 0 12px rgba(94,231,255,.8);font-variant-numeric:tabular-nums}
.hm-clock #hmdate{font-size:1.15rem;font-weight:500;color:#fff;margin-top:4px}
.hm-scopebox{filter:none}
.hm-scopebox>.b{background:rgba(94,231,255,.35)}
.hx.hm-scopebox>.b>.in{position:relative;overflow:hidden;padding:26px 0 30px;background:radial-gradient(circle at 50% 50%,#0b1a33,#03060f 75%)}
.hm-scopebox .sf{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%}
.hm-scope{position:relative;width:min(76vw,290px);aspect-ratio:1;margin:0 auto}
.hm-rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hm-rings g{transform-origin:150px 150px}
.hm-rings .seg{fill:none;stroke:var(--cy);stroke-width:5;stroke-dasharray:70 32;filter:drop-shadow(0 0 5px var(--cy))}
.hm-rings .segam{fill:none;stroke:var(--am);stroke-width:4;stroke-dasharray:4 6 4 6 4 120;filter:drop-shadow(0 0 4px rgba(255,181,71,.8))}
.hm-rings line{stroke:var(--cy2);stroke-width:1}
.hm-rings line.lg{stroke:var(--cy);stroke-width:2}
.hm-rings .c2{fill:none;stroke:var(--cy2);stroke-width:1.5}
.hm-rings .dia{fill:var(--cy)}
.hm-rings .cross line{stroke:var(--cy);stroke-width:2}
.hm-rings .lbl{fill:var(--cy);font-family:Orbitron,sans-serif;font-weight:700;font-size:20px;text-anchor:middle;filter:drop-shadow(0 0 4px var(--cy))}
.spin-slow{animation:hmSpin 80s linear infinite}.spin-rev{animation:hmSpin 50s linear infinite reverse}
@keyframes hmSpin{to{transform:rotate(360deg)}}
.hm-moon canvas{box-shadow:0 0 0 1px rgba(94,231,255,.18),0 0 26px rgba(94,231,255,.22)}
.hm-moon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:0}
.hm-sweep{position:absolute;inset:14%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(94,231,255,.13) 40deg,transparent 41deg);animation:hmSpin 7s linear infinite;mix-blend-mode:screen;pointer-events:none}
#home.still .spin-slow,#home.still .spin-rev,#home.still .hm-sweep,#home.still .dot{animation:none}
#home.still .hm-sweep{display:none}
@media (prefers-reduced-motion:reduce){#home *{animation:none!important}}
.hm-ros{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.hx.ro{--cut:9px}
.hx.ro>.b>.in{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 4px 12px;gap:3px}
.hx.ro .ic{height:32px;display:grid;place-items:center}
.hx.ro .ic svg{width:30px;height:30px;color:var(--am);stroke-width:1.8}
.hx.ro .k{font-size:.8rem;color:var(--txt2);line-height:1.15}
.hx.ro b{font-weight:600;font-size:1.15rem;line-height:1.2}
.hx.ro b.ph{font-size:.9rem}
.hm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hx.tile{cursor:pointer}
.hx.tile.wide{grid-column:1/-1}
.hx.tile>.b>.in{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px;min-height:124px}
.hx.tile:active>.b>.in{background:linear-gradient(170deg,#163657,#08142a)}
.hm-th{display:flex;align-items:center;gap:8px}
.hm-tic svg{width:30px;height:30px;color:var(--cy);stroke-width:1.7}
.hm-tt{flex:1;min-width:0;display:flex;flex-direction:column;font-family:Orbitron,var(--sans);font-weight:700;font-size:1.02rem;line-height:1.15;color:var(--cy)}
.hm-tt .no{font-size:.72rem;opacity:.8;letter-spacing:.12em;margin-bottom:2px}
.hx.tile.wide .hm-tt{flex-direction:row;align-items:baseline;gap:10px;font-size:1.15rem}
.hx.tile.wide .hm-tt .no{font-size:1.15rem;opacity:1;letter-spacing:0}
.hm-th{align-items:flex-start!important}
.hm-th .chev svg{width:24px;height:24px;color:var(--cy)}
.hm-row{display:flex;gap:14px;align-items:center}
.hm-col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.hm-thumb{position:relative;width:96px;height:96px;flex:none;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#0a1235 0%,#26306a 60%,#6b4f8f 85%,#2a2050 100%);box-shadow:0 0 0 1px var(--cy2)}
.hm-thumb .st{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%}
.hm-thumb .hill{position:absolute;left:-10%;right:-10%;bottom:-28px;height:46px;border-radius:50%;background:#050810}
.hm-stars{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

<body>
<div id="bgsky"><canvas id="bgc"></canvas></div>
<div id="app">
  <header id="hdr"></header>
  <main id="view"></main>
</div>

<script src="./luna-lib.js"></script>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   LUNA — noyau : état, utilitaires, calculs astronomiques, données
   Calculs : astronomy-engine (Don Cross, MIT) · Satellites : satellite.js (MIT)
   ════════════════════════════════════════════════════════════════════ */
const A = window.Astronomy, SAT = window.satellite, SKY = window.SKYDATA;
const DEG = Math.PI / 180, RAD = 180 / Math.PI;
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const KM_PER_AU = 149597870.7;
const ZARAGOZA = { lat: 41.6488, lon: -0.8891, name: 'Zaragoza' };
const APP_VERSION = '9.0';

/* ── Stockage local (toujours protégé) ─────────────────────────────── */
const store = {
  get(k, d) { try { const v = localStorage.getItem('luna_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('luna_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ── Dates & formats ───────────────────────────────────────────────── */
function pad(n) { return String(n).padStart(2, '0'); }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function noonOf(d) { const x = new Date(d); x.setHours(12, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function sameDay(a, b) { return !!(a && b) && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function dayDiff(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / DAY); }
function isToday(d) { return sameDay(d, new Date()); }
function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtTime(d) { return d ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : '—'; }
function fmtDay(d) { return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
function fmtDayLong(d) { return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
function fmtDate(d, year) { return d.toLocaleDateString('fr-FR', year ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'long' }); }
function fmtNum(n, dec) { return Number(n).toLocaleString('fr-FR', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
function fmtDur(ms) { const m = Math.round(ms / MIN); return Math.floor(m / 60) + ' h ' + pad(m % 60); }
function whenLabel(d, from) {
  const n = dayDiff(from || new Date(), d);
  if (n === 0) return "Aujourd'hui"; if (n === 1) return 'Demain'; if (n === -1) return 'Hier';
  return n > 1 ? 'Dans ' + n + ' j' : 'Il y a ' + (-n) + ' j';
}
function whenLong(d, from) {
  const n = dayDiff(from || new Date(), d);
  if (n === 0) return "Aujourd'hui à " + fmtTime(d);
  if (n === 1) return 'Demain à ' + fmtTime(d);
  return 'Dans ' + n + ' jours (' + fmtDay(d) + ') à ' + fmtTime(d);
}
function esc(s) { return s == null ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
const CARD8 = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
const CARD8L = ['nord', 'nord-est', 'est', 'sud-est', 'sud', 'sud-ouest', 'ouest', 'nord-ouest'];
function cardinal(az) { return CARD8[Math.round((((az % 360) + 360) % 360) / 45) % 8]; }
function cardinalLong(az) { return CARD8L[Math.round((((az % 360) + 360) % 360) / 45) % 8]; }
function vowel(s) { return /^[aeiouéèê]/i.test(s); }
function versDir(az) { const n = cardinalLong(az); return 'vers ' + (vowel(n) ? 'l’' : 'le ') + n; }
function deDir(az) { const n = cardinalLong(az); return vowel(n) ? 'de l’' + n : 'du ' + n; }
function fromTo(a, b) { return deDir(a) + ' ' + versDir(b); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function smooth(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function safe(fn, d) { try { const v = fn(); return v === undefined ? (d === undefined ? null : d) : v; } catch (e) { return d === undefined ? null : d; } }

/* ── État de l'application ─────────────────────────────────────────── */
const state = {
  tab: clamp(store.get('tab', 0) | 0, 0, 4),
  sub: { moonsun: 'moon', agenda: 'events' },
  date: noonOf(new Date()),
  loc: store.get('loc', null) || { lat: ZARAGOZA.lat, lon: ZARAGOZA.lon, name: ZARAGOZA.name, mode: 'gps' },
  eventFilter: 'all',
  calMonth: null,
  calSel: null,
  settings: Object.assign({ text: 'grand', red: false, anim: true }, store.get('settings', {}))
};
const ALERT_TYPES = [['full', 'Pleines lunes', 'super lune, lune bleue'], ['new', 'Nouvelles lunes', 'nuits noires'], ['eclipse', 'Éclipses visibles d’ici', ''], ['meteor', 'Étoiles filantes', 'au pic de chaque pluie'], ['season', 'Équinoxes et solstices', ''], ['planet', 'Planètes', 'oppositions, rapprochements'], ['launch', 'Lancements vers la Lune ou Mars', '']];
const ALERT_DEF = { full: true, new: false, eclipse: true, meteor: true, season: true, planet: false, launch: true };
state.settings.alerts = Object.assign({}, ALERT_DEF, state.settings.alerts || {});
function alertKind(e) { return e.cat === 'moon' ? (e.kind === 'new' ? 'new' : 'full') : e.cat; }
const DEEP_RE = /artemis|chang.?e|tianwen|blue ghost|blue moon|intuitive machines|\bIM-\d|griffin|\bMMX\b|escapade|chandrayaan|hakuto|ispace|lunar|luna-\d|moon|lune|mars|mangalyaan|rashid|exomars|rosalind franklin|mengzhou.*lan.?yue/i;
function launchDeep(l) {
  const m = l.mission || {};
  if (/lunar|selen|moon|mars|areo|trans.?lunar/i.test(m.orbit || '') || /^(LO|TLI|MO|TMI)$/i.test(m.orbitAbbrev || '')) return true;
  return DEEP_RE.test((m.name || '') + ' ' + (l.name || ''));
}
function saveSettings() { store.set('settings', state.settings); }

/* ── Observateur & positions ───────────────────────────────────────── */
let _obs = null, _obsKey = '';
function obs() {
  const k = state.loc.lat + ',' + state.loc.lon;
  if (k !== _obsKey) { _obs = new A.Observer(state.loc.lat, state.loc.lon, 200); _obsKey = k; resetCaches(); }
  return _obs;
}
function resetCaches() { for (const k in _evYear) delete _evYear[k]; for (const k in _memo) delete _memo[k]; }
const _memo = {};
function memo(key, fn) { if (key in _memo) return _memo[key]; const v = fn(); _memo[key] = v; return v; }

function riseSet(body, dir, from, days) {
  return safe(() => { const t = A.SearchRiseSet(body, obs(), dir, from, days || 1); return t ? t.date : null; });
}
function altCross(body, dir, from, alt, days) {
  return safe(() => { const t = A.SearchAltitude(body, obs(), dir, from, days || 1, alt); return t ? t.date : null; });
}
function transitOf(body, from) { return safe(() => A.SearchHourAngle(body, obs(), 0, from, +1).time.date); }
function bodyHz(body, date) {
  const eq = A.Equator(body, date, obs(), true, true);
  const hz = A.Horizon(date, obs(), eq.ra, eq.dec, 'normal');
  return { alt: hz.altitude, az: hz.azimuth, ra: eq.ra, dec: eq.dec, dist: eq.dist };
}
function sunAlt(date) { return bodyHz('Sun', date).alt; }

/* Soleil d'une journée */
function sunInfo(day) {
  return memo('sun' + dayKey(day) + _obsKey, () => {
    obs();
    const s0 = startOfDay(day);
    const noon = transitOf('Sun', s0) || noonOf(day);
    const r = {
      rise: riseSet('Sun', +1, s0), set: riseSet('Sun', -1, s0), noon,
      civDawn: altCross('Sun', +1, s0, -6), nauDawn: altCross('Sun', +1, s0, -12), astDawn: altCross('Sun', +1, s0, -18),
      civDusk: altCross('Sun', -1, noon, -6), nauDusk: altCross('Sun', -1, noon, -12), astDusk: altCross('Sun', -1, noon, -18),
      goldMornEnd: altCross('Sun', +1, s0, 6), goldEveStart: altCross('Sun', -1, noon, 6),
      blueMornEnd: altCross('Sun', +1, s0, -4), blueEveStart: altCross('Sun', -1, noon, -4)
    };
    if (r.rise && r.set && dayDiff(r.rise, r.set) === 0) r.dur = r.set - r.rise; else r.dur = null;
    r.noonAlt = safe(() => sunAlt(noon));
    return r;
  });
}

/* Nuit « de ce soir » : base = jour où commence la nuit */
function nightBase() {
  const d = state.date;
  if (isToday(d)) {
    const now = new Date(), s = sunInfo(now);
    if (s.rise && now < s.rise) return noonOf(addDays(now, -1));
    return noonOf(now);
  }
  return noonOf(d);
}
function nightInfo(base) {
  const a = sunInfo(base), b = sunInfo(addDays(base, 1));
  return {
    sunset: a.set, sunrise: b.rise,
    civStart: a.civDusk, civEnd: b.civDawn, nauStart: a.nauDusk, nauEnd: b.nauDawn,
    astStart: a.astDusk, astEnd: b.astDawn
  };
}

/* ── Lune ──────────────────────────────────────────────────────────── */
const QNAMES = ['Nouvelle lune', 'Premier quartier', 'Pleine lune', 'Dernier quartier'];
function phaseName(p) {
  if (p < 6 || p >= 354) return 'Nouvelle lune';
  if (p < 84) return 'Premier croissant';
  if (p < 96) return 'Premier quartier';
  if (p < 174) return 'Gibbeuse croissante';
  if (p < 186) return 'Pleine lune';
  if (p < 264) return 'Gibbeuse décroissante';
  if (p < 276) return 'Dernier quartier';
  return 'Dernier croissant';
}
function moonDistKm(date) { return A.GeoMoon(date).Length() * KM_PER_AU; }
function moonInfo(date) {
  const phase = A.MoonPhase(date);
  const ill = A.Illumination('Moon', date);
  const distKm = moonDistKm(date);
  return {
    phase, frac: ill.phase_fraction, distKm,
    age: phase / 360 * 29.530589,
    diam: 2 * Math.atan(1737.4 / distKm) * RAD * 60, // minutes d'arc
    name: phaseName(phase)
  };
}
function moonDay(day) {
  return memo('moon' + dayKey(day) + _obsKey, () => {
    obs();
    const s0 = startOfDay(day), e0 = addDays(s0, 1);
    let rise = riseSet('Moon', +1, s0), set = riseSet('Moon', -1, s0);
    if (rise && rise >= e0) rise = null;
    if (set && set >= e0) set = null;
    const tr = transitOf('Moon', s0);
    return { rise, set, transit: tr && tr < e0 ? tr : null };
  });
}
function quartersFrom(date, n) {
  const out = [];
  let q = safe(() => A.SearchMoonQuarter(date));
  while (q && out.length < n) { out.push({ q: q.quarter, date: q.time.date }); q = safe(() => A.NextMoonQuarter(q)); }
  return out;
}
const FULL_NAMES = ['Lune du loup', 'Lune de neige', 'Lune du ver', 'Lune rose', 'Lune des fleurs', 'Lune des fraises', 'Lune du cerf', 'Lune de l’esturgeon', 'Lune du maïs', 'Lune du chasseur', 'Lune du castor', 'Lune froide'];
function fullMoonName(d) {
  const y = d.getFullYear();
  const hv = memo('harvest' + y, () => {
    const eq = A.Seasons(y).sep_equinox.date;
    const f1 = A.SearchMoonPhase(180, new Date(eq.getTime() - 20 * DAY), 40).date;
    const f2 = A.SearchMoonPhase(180, new Date(f1.getTime() + 2 * DAY), 35).date;
    const harvest = Math.abs(f1 - eq) <= Math.abs(f2 - eq) ? f1 : f2;
    const hunter = A.SearchMoonPhase(180, new Date(harvest.getTime() + 2 * DAY), 35).date;
    return { harvest: harvest.getTime(), hunter: hunter.getTime() };
  });
  if (Math.abs(d - hv.harvest) < 2 * DAY) return 'Lune des moissons';
  if (Math.abs(d - hv.hunter) < 2 * DAY) return 'Lune du chasseur';
  const n = FULL_NAMES[d.getMonth()];
  return n === 'Lune du chasseur' ? 'Lune des chasseurs tardifs' : n;
}
const SUPERMOON_KM = 361000, MICROMOON_KM = 405000;

/* ── Planètes ──────────────────────────────────────────────────────── */
const PLANETS = [
  { id: 'Mercury', fr: 'Mercure', color: '#c9b49a' },
  { id: 'Venus', fr: 'Vénus', color: '#fff1c2' },
  { id: 'Mars', fr: 'Mars', color: '#ff8a5c' },
  { id: 'Jupiter', fr: 'Jupiter', color: '#f0d3a8' },
  { id: 'Saturn', fr: 'Saturne', color: '#ead48e' }
];
const BODY_FR = { Sun: 'Soleil', Moon: 'Lune', Mercury: 'Mercure', Venus: 'Vénus', Mars: 'Mars', Jupiter: 'Jupiter', Saturn: 'Saturne' };
const CONS_FR = {};
(SKY && SKY.cons || []).forEach(c => { CONS_FR[c[0]] = c[1]; });
function consOf(raHours, dec) { return safe(() => { const c = A.Constellation(raHours, dec); return CONS_FR[c.symbol] || c.name; }, ''); }

/* Visibilité d'une planète pendant la nuit (échantillonnage 15 min) */
function planetNight(p, base) {
  return memo('pn' + p.id + dayKey(base) + _obsKey, () => {
    const n = nightInfo(base);
    const t0 = n.sunset || new Date(noonOf(base).getTime() + 7 * HOUR);
    const t1 = n.sunrise || new Date(t0.getTime() + 12 * HOUR);
    let best = null, first = null, last = null;
    for (let t = t0.getTime(); t <= t1.getTime(); t += 15 * MIN) {
      const d = new Date(t);
      if (sunAlt(d) > -7) continue;
      const h = bodyHz(p.id, d);
      if (h.alt > 8) {
        if (!first) first = d;
        last = d;
        if (!best || h.alt > best.alt) best = { date: d, alt: h.alt, az: h.az };
      }
    }
    const mid = best ? best.date : new Date((t0.getTime() + t1.getTime()) / 2);
    const eq = A.Equator(p.id, mid, obs(), true, true);
    const ill = A.Illumination(p.id, mid);
    const el = A.Elongation(p.id, mid);
    const s0 = startOfDay(base);
    return {
      p, best, first, last,
      mag: ill.mag, elong: el.elongation, side: el.visibility,
      cons: consOf(eq.ra, eq.dec),
      rise: riseSet(p.id, +1, s0, 1.5), set: riseSet(p.id, -1, noonOf(base), 1),
      distKm: eq.dist * KM_PER_AU
    };
  });
}

/* ── Événements astronomiques calculés (année par année) ──────────── */
const METEORS = [
  { m: 0, d: 3, name: 'Quadrantides', zhr: 80, rad: 'Bouvier' },
  { m: 3, d: 22, name: 'Lyrides', zhr: 18, rad: 'Lyre' },
  { m: 4, d: 6, name: 'Êta Aquarides', zhr: 50, rad: 'Verseau (bas sur l’horizon)' },
  { m: 6, d: 30, name: 'Delta Aquarides', zhr: 25, rad: 'Verseau' },
  { m: 7, d: 12, name: 'Perséides', zhr: 100, rad: 'Persée' },
  { m: 9, d: 8, name: 'Draconides', zhr: 10, rad: 'Dragon' },
  { m: 9, d: 21, name: 'Orionides', zhr: 20, rad: 'Orion' },
  { m: 10, d: 17, name: 'Léonides', zhr: 15, rad: 'Lion' },
  { m: 11, d: 14, name: 'Géminides', zhr: 150, rad: 'Gémeaux' },
  { m: 11, d: 22, name: 'Ursides', zhr: 10, rad: 'Petite Ourse' }
];
const EV_CATS = { eclipse: 'Éclipses', meteor: 'Étoiles filantes', planet: 'Planètes', moon: 'Lune', season: 'Saisons' };
const _evYear = {};
const EV_VER = 3;
function evCacheKey(y) { return 'ev' + EV_VER + '_' + y + '_' + state.loc.lat.toFixed(1) + '_' + state.loc.lon.toFixed(1); }
function eventsReady(y) {
  if (_evYear[y]) return true;
  const c = store.get(evCacheKey(y), null);
  if (c && Array.isArray(c)) { _evYear[y] = c.map(e => Object.assign(e, { date: new Date(e.ts) })); return true; }
  return false;
}
function eventsOfYear(y) {
  if (eventsReady(y)) return _evYear[y];
  const o = obs();
  const start = new Date(y, 0, 1), end = new Date(y + 1, 0, 1);
  const ev = [];
  const add = e => { if (e.date >= start && e.date < end) ev.push(e); };

  /* Phases : nouvelles & pleines lunes (super, micro, bleue) */
  safe(() => {
    let q = A.SearchMoonQuarter(new Date(start.getTime() - 3 * DAY)), guard = 0, lastFullMonth = null;
    while (q && q.time.date < end && guard++ < 70) {
      const d = q.time.date;
      if (q.quarter === 2) {
        const km = moonDistKm(d), mk = d.getFullYear() * 12 + d.getMonth();
        const blue = lastFullMonth === mk;
        lastFullMonth = mk;
        const sup = km < SUPERMOON_KM, mic = km > MICROMOON_KM;
        const nm = fullMoonName(d);
        let title = sup ? 'Super lune' : mic ? 'Micro lune' : 'Pleine lune';
        if (blue) title += ' bleue';
        let detail = nm + ' · ' + fmtNum(Math.round(km / 100) * 100) + ' km';
        if (sup) detail += ' · plus grande et plus lumineuse';
        if (blue) detail += ' · 2ᵉ pleine lune du mois';

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('luna-alerts', 2);
    r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('events')) db.createObjectStore('events', { keyPath: 'id' }); if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbPutAlerts(list) {

  await new Promise((res, rej) => { const tx = db.transaction('events', 'readwrite'), s = tx.objectStore('events'); s.clear(); list.forEach(a => s.put(a)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function idbMeta(key, val) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('meta', val === undefined ? 'readonly' : 'readwrite'), s = tx.objectStore('meta');
    if (val === undefined) { const q = s.get(key); q.onsuccess = () => res(q.result ? q.result.value : null); q.onerror = () => rej(q.error); }
    else { s.put({ key, value: val }); tx.oncomplete = () => res(val); tx.onerror = () => rej(tx.error); }
  });
}

function buildAlerts() {
  const now = new Date(), end = addDays(startOfDay(now), 8), out = [];
  const y = now.getFullYear();
  if (eventsReady(y) && eventsReady(y + 1))
    for (const e of eventsBetween(new Date(now.getTime() - 2 * HOUR), end)) if (e.notify && state.settings.alerts[alertKind(e)]) out.push({ id: e.id, ts: e.date.getTime(), title: 'Luna · ' + e.title, body: e.short || e.detail, cat: e.cat });
